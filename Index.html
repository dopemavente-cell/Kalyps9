<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kalyps‑9 — Histoire Interactive</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: #0a0a0f;
        font-family: Arial, sans-serif;
        color: #e0e0e0;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    /* Zone image interactive */
    #scene {
        height: 35vh;
        background: url('IMAGE_PANORAMA.jpg') center/cover no-repeat;
        position: relative;
        border-bottom: 2px solid #222;
    }

    /* Effet de glissement */
    #scene::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.6));
    }

    /* Chat */
    #chat {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
    }

    .message {
        margin-bottom: 12px;
        padding: 10px 14px;
        border-radius: 8px;
        max-width: 80%;
        line-height: 1.4;
    }

    .ia {
        background: #1c1c28;
        border-left: 3px solid #6a5acd;
    }

    .user {
        background: #262626;
        border-right: 3px solid #00c8ff;
        margin-left: auto;
    }

    /* Champ d'action */
    #inputZone {
        display: flex;
        padding: 10px;
        background: #111;
        border-top: 2px solid #222;
    }

    #actionInput {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #1b1b1f;
        color: #fff;
        font-size: 16px;
    }

    #sendBtn {
        margin-left: 10px;
        padding: 12px 18px;
        background: #6a5acd;
        border: none;
        border-radius: 6px;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    #sendBtn:hover {
        background: #7b6df0;
    }
</style>
</head>

<body>

<!-- IMAGE INTERACTIVE -->
<div id="scene"></div>

<!-- CHAT -->
<div id="chat">
    <div class="message ia">
        Bienvenue sur Kalyps‑9. La brume acide danse entre les néons.  
        Tu es journaliste. Et tu viens de filmer quelque chose que tu n’aurais jamais dû voir…
    </div>
</div>

<!-- INPUT -->
<div id="inputZone">
    <input id="actionInput" type="text" placeholder="Écris ton action..." />
    <button id="sendBtn">→</button>
</div>

<script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("actionInput");
    const btn = document.getElementById("sendBtn");

    function addMessage(text, sender) {
        const div = document.createElement("div");
        div.className = "message " + sender;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    // Simulation IA (à remplacer par ton API plus tard)
    function fakeIAResponse(action) {
        if (action.toLowerCase().includes("regarde")) {
            return "Tu observes autour de toi. Un drone flotte dans l’ombre, son œil rouge clignotant.";
        }
        if (action.toLowerCase().includes("fuis")) {
            return "Tu t’élances dans la ruelle. La brume pique tes yeux. Des pas résonnent derrière toi.";
        }
        if (action.toLowerCase().includes("cache")) {
            return "Tu te glisses derrière un conteneur métallique. Le bruit des bottes se rapproche.";
        }
        return "Ton cœur bat fort. La ville semble retenir son souffle. Que fais-tu ensuite ?";
    }

    btn.addEventListener("click", () => {
        const action = input.value.trim();
        if (!action) return;

        addMessage(action, "user");
        input.value = "";

        setTimeout(() => {
            const response = fakeIAResponse(action);
            addMessage(response, "ia");
        }, 400);
    });
</script>

</body>
</html>
